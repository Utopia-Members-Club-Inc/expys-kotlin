# detekt static-analysis config for the Expys Kotlin SDK. Layered on top of the
# default rule set (buildUponDefaultConfig = true in build.gradle.kts); only the
# rules that conflict with this SDK's intentional, documented choices are tuned.
# The generated models are excluded at the task level, not here.

build:
  maxIssues: 0

complexity:
  TooManyFunctions:
    # ExpysClient is an intentionally flat data-API surface (one method per
    # endpoint) for cross-SDK parity with the TS/Swift clients; the per-class
    # function count tracks the API, not accidental growth. Raised for the
    # server-mode methods (members, wallet credit, analytics, webhooks, token
    # exchange).
    thresholdInClasses: 32

exceptions:
  TooGenericExceptionCaught:
    # The transport intentionally catches a broad Exception to map any transport
    # failure to a typed ExpysException (rethrowing CancellationException first).
    active: false
  SwallowedException:
    # The proactive-refresh failure is deliberately swallowed; the reactive 401
    # path recovers. Documented at the catch site.
    active: false

style:
  MagicNumber:
    # HTTP status codes (401, 429, 500...) and millisecond constants read more
    # clearly inline than as named constants; the TS/Swift linters do not flag them.
    active: false
  ReturnCount:
    active: true
    max: 4
  ForbiddenComment:
    # Allow the tracked TODO(lead) marker for the canonical public domain.
    active: false
  LoopWithTooManyJumpStatements:
    active: false

naming:
  MatchingDeclarationName:
    # Source files are named by concept (Version.kt, Errors.kt) for cross-SDK parity
    # with the TS/Swift SDKs; Version.kt is also sed-synced at release time.
    active: false
